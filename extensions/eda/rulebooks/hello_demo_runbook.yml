---
- name: Listen for events on a webhook
  hosts: all
  sources:   
    - name: Wait for Webhook Message
      ansible.eda.webhook:
        host: 0.0.0.0
        port: 5001
  rules:
    - name: Run Job Template
      condition: event.payload.message == "run-job-template"
      action:
        run_job_template:
          name: Demo Job Template
          organization: Default
          
